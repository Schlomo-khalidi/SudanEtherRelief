<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Witness Relay — OG Card 1200×630</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #221c44; position: relative;
    font-family: 'Inter', system-ui, sans-serif; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(900px 500px at 88% -10%, rgba(232,68,46,.28), transparent 60%),
      radial-gradient(700px 420px at -8% 110%, rgba(74,67,112,.55), transparent 55%),
      #221c44; }
  .rule { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #e8442e; }
  .inner { position: absolute; inset: 0; padding: 58px 70px 0 84px; display: flex; flex-direction: column; }
  .brandrow { display: flex; align-items: center; gap: 16px; }
  .seal { width: 54px; height: 54px; }
  .brandname { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 26px; color: #fff; }
  .brandname em { font-style: normal; color: #ff8a75; }
  .wire { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: .16em;
    text-transform: uppercase; color: #9d96c9; text-align: right; }
  .wire b { color: #ff8a75; }
  .headline { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 64px; line-height: 1.08;
    color: #fff; letter-spacing: -.015em; max-width: 950px; margin-top: 44px; }
  .dateline { font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase;
    color: #ff8a75; margin-top: 26px; }
  .bottom { position: absolute; left: 84px; right: 70px; bottom: 52px; display: flex; align-items: flex-end; gap: 28px; }
  .proof { display: flex; gap: 34px; }
  .p b { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 34px; color: #fff; line-height: 1; }
  .p span { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #9d96c9; display: block; margin-top: 6px; }
  .p.hot b { color: #7fd3a8; }
  .cta { margin-left: auto; background: #e8442e; color: #fff; border-radius: 14px; padding: 20px 30px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px; box-shadow: 0 12px 30px rgba(232,68,46,.35); }
  .cta b { font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 700; }
  .cta span { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #ffd9d1; }
  .stamp2 { position: absolute; right: 74px; top: 140px; transform: rotate(4deg); border: 3px solid #7fd3a8; color: #7fd3a8;
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; letter-spacing: .18em; text-transform: uppercase;
    padding: 9px 16px; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(127,211,168,.3); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="rule"></div>

  <div class="inner">
    <div class="brandrow">
      <svg class="seal" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#ff8a75" stroke-width="2"/><circle cx="17" cy="17" r="10.5" fill="none" stroke="#ff8a75" stroke-width="1" stroke-dasharray="3 2.4"/><path d="M12 17.5l3.4 3.4L22.5 13.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brandname">Witness <em>Relay</em></span>
      <span class="wire">Witness verified · <b>3 cited sources</b></span>
    </div>

    <div class="headline">Famine confirmed in Zamzam camp. The corridor is still closed.</div>
    <div class="dateline">Zamzam Camp, North Darfur — 24 Sept 2026</div>

    <div class="stamp2">Human approved</div>

    <div class="bottom">
      <div class="proof">
        <div class="p"><b>38</b><span>Relayers carrying</span></div>
        <div class="p"><b>9,412</b><span>Verified views</span></div>
        <div class="p hot"><b>$2,340</b><span>Confirmed donated</span></div>
      </div>
      <div class="cta"><b>See the sources. Give if moved.</b><span>witnessrelay.org · with Ethar Relief</span></div>
    </div>
  </div>
</body>
</html>
